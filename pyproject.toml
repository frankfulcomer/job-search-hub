[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-hub"
version = "0.1.0"
description = "A personal job application tracking application."
requires-python = ">=3.14"
dependencies = [
    "Flask>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
